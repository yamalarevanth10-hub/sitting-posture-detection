<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Digital Wellness Monitor</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Style -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width: 500px;">
    <div class="auth-header">
      <div class="brand-logo">
        <div class="pulse-ring"></div>
        <i class="fa-solid fa-person-burst"></i>
      </div>
      <h2>Create Your Account</h2>
      <p>Start tracking your posture, eye strain, and ergonomic health</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="alert-box">
      <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
      <span id="alert-msg"></span>
    </div>

    <!-- Registration Form -->
    <form id="register-form" class="auth-form" onsubmit="return handleRegister(event);">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-id-card field-icon"></i>
          <input type="text" id="full_name" placeholder="John Doe" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-at field-icon"></i>
          <input type="text" id="username" placeholder="johndoe" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-envelope field-icon"></i>
          <input type="email" id="email" placeholder="john@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="At least 8 chars with letters & numbers" required autocomplete="new-password" oninput="checkStrength(this.value)">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="strength-meter-wrap">
          <div class="strength-bar-track">
            <div id="strength-bar" class="strength-bar-fill"></div>
          </div>
          <div class="strength-label">
            <span>Strength: <strong id="strength-text">Empty</strong></span>
            <span>Min 8 chars, 1 letter, 1 number</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-shield-halved field-icon"></i>
          <input type="password" id="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
        <span id="btn-text">Register Account</span>
        <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login" class="auth-link">Sign In</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function checkStrength(pwd) {
      const bar = document.getElementById('strength-bar');
      const label = document.getElementById('strength-text');
      if (!pwd) {
        bar.style.width = '0%';
        bar.style.backgroundColor = 'transparent';
        label.textContent = 'Empty';
        label.style.color = 'var(--text-dim)';
        return;
      }

      let score = 0;
      if (pwd.length >= 8) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/\d/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      if (score <= 2) {
        bar.style.width = '30%';
        bar.style.backgroundColor = 'var(--color-danger)';
        label.textContent = 'Weak';
        label.style.color = 'var(--color-danger)';
      } else if (score <= 4) {
        bar.style.width = '65%';
        bar.style.backgroundColor = 'var(--color-warning)';
        label.textContent = 'Medium';
        label.style.color = 'var(--color-warning)';
      } else {
        bar.style.width = '100%';
        bar.style.backgroundColor = 'var(--color-good)';
        label.textContent = 'Strong';
        label.style.color = 'var(--color-good)';
      }
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      const msg = document.getElementById('alert-msg');
      const icon = document.getElementById('alert-icon');
      
      box.className = `alert-box active ${type}`;
      msg.textContent = message;
      
      if (type === 'success') {
        icon.className = 'fa-solid fa-circle-check';
      } else {
        icon.className = 'fa-solid fa-triangle-exclamation';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('full_name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (!fullName || !username || !email || !password || !confirmPassword) {
        showAlert('Please fill in all fields.');
        return false;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter.');
        return false;
      }

      if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
        showAlert('Password must be at least 8 characters with at least one letter and one number.');
        return false;
      }

      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating Account...';

      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            username: username,
            email: email,
            password: password,
            confirm_password: confirmPassword
          })
        });

        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          showAlert('Account registered successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login?registered=1';
          }, 1000);
        } else {
          showAlert(data.detail || data.message || 'Registration failed.');
          btn.disabled = false;
          btnText.textContent = 'Register Account';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btnText.textContent = 'Register Account';
      }
      return false;
    }
  </script>
</body>
</html>
