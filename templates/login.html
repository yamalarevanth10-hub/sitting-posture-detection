<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Digital Wellness Monitor</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Style -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo">
        <div class="pulse-ring"></div>
        <i class="fa-solid fa-person-burst"></i>
      </div>
      <h2>Digital Wellness Monitor</h2>
      <p>Sign in to access your personal ergonomics & posture dashboard</p>
    </div>

    <!-- Feedback Message Alert Box -->
    <div id="alert-box" class="alert-box">
      <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
      <span id="alert-msg"></span>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form" onsubmit="return handleLogin(event);">
      <div class="form-group">
        <label for="identifier">Email or Username</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="identifier" placeholder="Enter username or email" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options-row">
        <label class="checkbox-label" for="remember-me">
          <input type="checkbox" id="remember-me">
          <span>Remember Me</span>
        </label>
        <a href="/forgot-password" class="auth-link">Forgot Password?</a>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
        <span id="btn-text">Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <!-- Public Demo Account Card -->
      <div class="demo-login-box">
        <div class="demo-title">
          <i class="fa-solid fa-flask-vial"></i> Quick Public Demo Access
        </div>
        <div class="demo-creds">
          User: <code>demo</code> &bull; Pass: <code>Demo@123</code>
        </div>
        <button type="button" class="btn-demo-quick" onclick="useDemoLogin()">
          <i class="fa-solid fa-bolt"></i> One-Click Demo Sign In
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register" class="auth-link">Create Account</a>
    </div>
  </div>

  <script>
    // Check URL parameters for flash messages (e.g. ?registered=1)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === '1') {
        showAlert('Account created successfully! Please sign in with your credentials.', 'success');
      } else if (urlParams.get('reset') === '1') {
        showAlert('Password reset successfully! Please sign in with your new password.', 'success');
      } else if (urlParams.get('logged_out') === '1') {
        showAlert('You have been logged out securely.', 'info');
      }
    });

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      const msg = document.getElementById('alert-msg');
      const icon = document.getElementById('alert-icon');
      
      box.className = `alert-box active ${type}`;
      msg.textContent = message;
      
      if (type === 'success') {
        icon.className = 'fa-solid fa-circle-check';
      } else if (type === 'info') {
        icon.className = 'fa-solid fa-circle-info';
      } else {
        icon.className = 'fa-solid fa-triangle-exclamation';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');

      if (!identifier || !password) {
        showAlert('Please fill in both email/username and password.');
        return false;
      }

      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing In...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, remember_me: rememberMe })
        });

        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          showAlert('Signed in successfully! Redirecting...', 'success');
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get('next') || '/';
          setTimeout(() => {
            window.location.href = nextUrl;
          }, 400);
        } else {
          showAlert(data.detail || data.message || 'Invalid username or password.');
          btn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert('Network error. Please make sure the server is running.');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      }
      return false;
    }

    async function useDemoLogin() {
      document.getElementById('identifier').value = 'demo';
      document.getElementById('password').value = 'Demo@123';
      
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading Demo...';

      try {
        const resp = await fetch('/api/auth/demo-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          showAlert('Demo session initialized! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 400);
        } else {
          showAlert(data.detail || 'Demo login failed.');
          btn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert('Network error connecting to demo account.');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
