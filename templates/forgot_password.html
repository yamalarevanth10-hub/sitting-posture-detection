<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Digital Wellness Monitor</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Style -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo">
        <div class="pulse-ring"></div>
        <i class="fa-solid fa-key"></i>
      </div>
      <h2>Password Recovery</h2>
      <p>Enter your username or email address to reset your account password</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="alert-box">
      <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
      <span id="alert-msg"></span>
    </div>

    <!-- Dev Mode Token Box (Displayed when reset link is generated) -->
    <div id="dev-reset-box" class="demo-login-box" style="display: none; text-align: left; margin-bottom: 18px;">
      <div class="demo-title" style="justify-content: flex-start; color: var(--color-good);">
        <i class="fa-solid fa-shield-halved"></i> Academic Dev-Mode Reset Link
      </div>
      <p style="font-size: 0.76rem; color: var(--text-muted); margin-bottom: 8px;">
        In academic/local mode without an SMTP mail server, the secure reset token is generated directly below:
      </p>
      <a id="dev-reset-link" href="#" class="btn btn-sm btn-primary" style="display: block; text-align: center; text-decoration: none;">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Password Reset Page
      </a>
    </div>

    <!-- Form -->
    <form id="forgot-form" class="auth-form" onsubmit="return handleForgot(event);">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-envelope field-icon"></i>
          <input type="text" id="identifier" placeholder="Enter your registered username or email" required>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
        <span id="btn-text">Generate Reset Link</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <div class="auth-footer">
      Remembered your password? <a href="/login" class="auth-link">Back to Sign In</a>
    </div>
  </div>

  <script>
    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      const msg = document.getElementById('alert-msg');
      const icon = document.getElementById('alert-icon');
      
      box.className = `alert-box active ${type}`;
      msg.textContent = message;
      
      if (type === 'success') {
        icon.className = 'fa-solid fa-circle-check';
      } else if (type === 'info') {
        icon.className = 'fa-solid fa-circle-info';
      } else {
        icon.className = 'fa-solid fa-triangle-exclamation';
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      const devBox = document.getElementById('dev-reset-box');
      const devLink = document.getElementById('dev-reset-link');

      if (!identifier) {
        showAlert('Please enter your username or email.');
        return false;
      }

      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
      devBox.style.display = 'none';

      try {
        const resp = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier })
        });

        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          showAlert(data.message, 'success');
          if (data.reset_url) {
            devBox.style.display = 'block';
            devLink.href = data.reset_url;
          }
          btnText.textContent = 'Link Generated';
        } else {
          showAlert(data.detail || 'Could not find an account with that identifier.');
          btn.disabled = false;
          btnText.textContent = 'Generate Reset Link';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btnText.textContent = 'Generate Reset Link';
      }
      return false;
    }
  </script>
</body>
</html>
