<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Digital Wellness Monitor</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Style -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo">
        <div class="pulse-ring"></div>
        <i class="fa-solid fa-lock-open"></i>
      </div>
      <h2>Create New Password</h2>
      <p>Set a secure password for your account</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="alert-box">
      <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
      <span id="alert-msg"></span>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" class="auth-form" onsubmit="return handleReset(event);">
      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="new_password" placeholder="At least 8 characters" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-shield-halved field-icon"></i>
          <input type="password" id="confirm_password" placeholder="Re-enter new password" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-auth-submit">
        <span id="btn-text">Save New Password</span>
        <i class="fa-solid fa-check"></i>
      </button>
    </form>

    <div class="auth-footer">
      Back to <a href="/login" class="auth-link">Sign In</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      const msg = document.getElementById('alert-msg');
      const icon = document.getElementById('alert-icon');
      
      box.className = `alert-box active ${type}`;
      msg.textContent = message;
      
      if (type === 'success') {
        icon.className = 'fa-solid fa-circle-check';
      } else {
        icon.className = 'fa-solid fa-triangle-exclamation';
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showAlert('Missing or invalid password reset token. Please request a new link.');
        return false;
      }

      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match.');
        return false;
      }

      if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/\d/.test(newPassword)) {
        showAlert('Password must be at least 8 characters with at least one letter and one number.');
        return false;
      }

      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';

      try {
        const resp = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword })
        });

        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          showAlert('Password updated successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/login?reset=1';
          }, 1200);
        } else {
          showAlert(data.detail || 'Failed to reset password. Link may have expired.');
          btn.disabled = false;
          btnText.textContent = 'Save New Password';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btnText.textContent = 'Save New Password';
      }
      return false;
    }
  </script>
</body>
</html>
